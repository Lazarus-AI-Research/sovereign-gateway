# Example serve config, translated from a fujitsu llm_config.yaml deployment.
#
# Models are NOT configured here — they live in the database. Load them from the
# companion models file with:
#   gateway import examples/fujitsu.models.toml examples/fujitsu.toml
# then serve:
#   gateway examples/fujitsu.toml
#
# This config runs fully offline (upstream.mode = "mock"); for a real run set
# upstream.mode = "http" and put reachable api_base/api_key values in the models
# file. Accounts live in the DB — `serve` auto-creates admin/admin on first run.
[server]
bind = "127.0.0.1:8810"
[database]
backend = "sqlite"
path = "./fujitsu.db"
[upstream]
mode = "mock"          # offline; for a real run set "http" + reachable api_base/keys
[reqlog]
enabled = true
dir = "./fujitsu-reqlog"
rotate_secs = 1
[routing]
strategy = "simple"
