# Models for the fujitsu example, loaded with:
#   gateway import examples/fujitsu.models.toml examples/fujitsu.toml
#
# The source llm_config.yaml's model_mapping (tier names) becomes aliases:
# s_tier -> gpt-5.5, a_tier -> gpt-5.4, b_tier -> gpt-5.4-mini. Each deployment
# carries its own api_key (placeholder here; required only for a real http run).

[[model]]
model_name = "gemini-3.1-pro-preview"
  [[model.deployments]]
  provider = "gemini"
  upstream_model = "gemini-3.1-pro-preview"
  upstream_format = "gemini"
  api_base = "http://127.0.0.1:8082/v1beta"
  api_key = "REPLACE_WITH_YOUR_KEY"

