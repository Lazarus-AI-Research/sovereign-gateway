[package]
name = "greater-spire"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "SPIFFE mTLS for Rust services using local certificates or an embedded SPIRE agent"

[package.metadata.greater-spire]
spire-server-version = "=1.15.3"
spire-api-schema-version = "v1.15.3"
protobuf-compiler = "protox"

[features]
default = ["http"]
http = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tower-service"]
static-ca = ["rcgen/pem", "rcgen/x509-parser", "dep:time"]
legacy-policy = []
test-utils = []

[[bin]]
name = "greater-spire-setup"
path = "src/bin/setup.rs"
required-features = ["static-ca"]

[[example]]
name = "service_client"
required-features = ["http"]

[dependencies]
arc-swap = "1.7"
base64 = "0.22"
bytes = { version = "1", optional = true }
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "service", "tokio"], optional = true }
libc = "0.2"
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spiffe = { version = "0.16", features = ["x509"] }
thiserror = "2"
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.9"
tower-service = { version = "0.3", optional = true }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring"] }
tonic-prost = "0.14"
tracing = "0.1"
x509-parser = "0.18"
zeroize = "1.8"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
tempfile = "3"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
