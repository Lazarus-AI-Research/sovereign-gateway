[workspace]
resolver = "2"
members = [
    "crates/yb-core",
    "crates/yb-wire",
    "crates/yb-store",
    "crates/yb-providers",
    "crates/yb-reqlog",
    "crates/yb-otel",
    "crates/yb-gateway",
    "crates/yb-server",
    "crates/yb-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SovereignGateway"]
rust-version = "1.94"

[workspace.dependencies]
# internal
yb-core = { path = "crates/yb-core" }
yb-wire = { path = "crates/yb-wire" }
yb-store = { path = "crates/yb-store" }
yb-providers = { path = "crates/yb-providers" }
yb-reqlog = { path = "crates/yb-reqlog" }
yb-otel = { path = "crates/yb-otel" }
yb-gateway = { path = "crates/yb-gateway" }
yb-server = { path = "crates/yb-server" }

# shared external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
duckdb = { version = "1", features = ["bundled"] }

[profile.dev]
# keep iteration fast; the bundled duckdb build is the slow part
opt-level = 0
